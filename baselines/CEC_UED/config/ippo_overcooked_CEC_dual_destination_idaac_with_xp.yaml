"ENV_NAME": "ToyCoopNoPink"
"LR": 3e-4 #checked
"NUM_ENVS": 256
"NUM_SEEDS": 1
"NUM_STEPS": 100 # Dual Destination horizon
"FC_DIM_SIZE": 256
"GRU_HIDDEN_DIM": 256
"TOTAL_TIMESTEPS": 1e8
"MAX_TRAIN_STEPS": 1e8 #checked
"UPDATE_EPOCHS": 32 #checked
"NUM_MINIBATCHES": 2 #checked
"GAMMA": 0.99 #checked
"GAE_LAMBDA": 0.95 #checked
"CLIP_EPS": 0.2 #checked
"SCALE_CLIP_EPS": False
"ENT_COEF": 0.005 #checked
"VF_COEF": 1.0 #checked
"MOA_COEF": 1.0
"MAX_GRAD_NORM": 0.5 #checked
"ACTIVATION": "relu" #checked
"ANNEAL_LR": True
"SEED": 0
"ENV_KWARGS": 
  "random_reset" : True #checked # relevant for which env to train/test on. If true, it is CEC, otherwise single task
  "max_steps": 100
  "check_held_out": True  # set True for CEC/random_reset held-out training
  # toy specific kwargs
  "debug": False
  "partial_obs": False
  "incentivize_strat": 2 # choose [0, 1, 2, 3] for top, bottom, none, or multiple
  # overcooked specific kwargs
  "shuffle_inv_and_pot": False # if true, we shuffle pot status and inventory
  "layout": "cramped_room_9"  # relevant for overcooked, all CEC compatible envs have the "_9" in the name at the end
  "random_reset_fn": "reset_all"  # reset_all or reset_counter_circuit
"TRAINING": True
"TRAIN_KWARGS":
  "ckpt_id": 0 # loads from ckpt_id - 1 if available
  "overwrite_ckpt": True # if true, will overwrite ckpt_id
  "finetune": False # if true, load from opposing paradigm and cut learning rate by 10x
  "e3t_beta": 0.55  # how much randomness to add to probabilities of one partner. If 0 then it's completely uniform, if 1 then it's same as original, if higher than 1 we're magnifying the extremes
"TEST_KWARGS":
  "beta": 1.0
  "argmax": False  # otherwise we sample from policy
  "num_trajs": 2
  "plot": False  # if true, will get precedence over saving data
  "self_play": False  # get's full cross play matrix
  "ik": False # relevant to which model to load (ik vs sk)
  "debug": False
  "use_ckpt": True  # if true, will load from ckpt_id, otherwise will load from latest
"CONV_NET": True
"LSTM": True
"FCP": False
"FCP_KWARGS":
  "train_oracle": False
# WandB Params
"ENTITY": "overcooked_ai"                                          
"PROJECT": "crossenv_ued_ICLR_dual_destination"
"WANDB_MODE" : "online" # disabled, online, offline
"WANDB_GROUP": null
"model_name": "CEC_IDAAC"
"save_frames": False
"save_frames_interval": 200
"save_env_state": False
"save_env_state_interval": 10
"EVAL_KWARGS":
  "eval_interval": 25
  "num_envs": 5            
  "num_steps": 100         
  "max_steps": 100
  "random_reset": False    
  "check_held_out": False  
  "shuffle_inv_and_pot": False
  "random_reset_fn": "reset_all" 
  "beta": 1.0
  "argmax": False

# Modified-wall ToyCoop override. Kept at the bottom so experiment-specific edits are obvious.
"map_name": "mixed"  # empty, wall_a, wall_b, wall_c, mixed

# CEC/IDAAC additions.
"GRAD_CONFLICT_STEPS": 32
"SAVE_CKPT_INTERVAL": 5000
"RESUME_XPID": ""

# Layout-eval ToyCoop CEC additions.
"TOY_HELDOUT_NUM": 100
"CKPT_TAG": ""
"layout_names":
  - "empty"
  - "wall_a"

# Training-time XP against a completed partner seed.
"XP_KWARGS":
  "enabled": False
  "partner_seed": 98
  "num_envs": 5
  "num_steps": 100
  "beta": 1.0
  "argmax": False

